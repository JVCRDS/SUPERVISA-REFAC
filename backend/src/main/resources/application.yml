server:
  address: 0.0.0.0
  port: 8080

spring:
  application:
    name: visacampo
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:visacampo}
    username: ${DB_USER:visa}
    password: ${DB_PASSWORD:visa}
  jpa:
    open-in-view: false
    hibernate:
      # Esquema e evoluido apenas pelo Flyway. Hibernate so valida que as
      # entidades batem com as tabelas existentes, nunca altera o banco.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
